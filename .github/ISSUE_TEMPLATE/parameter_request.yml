name: Parameter request
description: Ask for a synthesizer parameter to be supported
labels: [parameter]
body:
  - type: input
    id: device
    attributes:
      label: Device and engine
      placeholder: Yamaha MODX+, AWM2
    validations:
      required: true
  - type: input
    id: parameter
    attributes:
      label: Parameter name
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Official source
      description: Document title, edition and page where the address and data range are published.
    validations:
      required: true
