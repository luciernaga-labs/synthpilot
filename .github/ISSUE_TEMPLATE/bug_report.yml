name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select Yamaha MODX+
        2. Create a new AWM2 sound
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SynthPilot version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
