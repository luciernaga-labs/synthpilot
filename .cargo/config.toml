[alias]
coverage = [
    "llvm-cov",
    "--workspace",
    "--all-features",
    "--ignore-filename-regex",
    "(synthpilot/src/main\\.rs|synthpilot/src/app/(mod|editor|preview|sidebar|theme|assistant_view)\\.rs|synthpilot-midi/src/device\\.rs|synthpilot-assistant/src/http\\.rs)$",
    "--fail-under-lines",
    "90",
]
